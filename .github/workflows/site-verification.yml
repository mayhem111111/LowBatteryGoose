name: Site verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/platform-intake-flock-docs, fix/flock-clean-url-routing, fix/site-quality-and-auth-tests, fix/governance-rate-limiter, fix/site-metadata-audit]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository checks
        run: node --test tests/*.test.mjs
      - name: Validate rate limiter Worker configuration
        run: npx --yes wrangler@4.36.0 deploy --dry-run --config workers/governance-rate-limiter/wrangler.toml
