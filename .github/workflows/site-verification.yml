name: Site verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, work/platform-intake-flock-docs]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository checks
        run: node --test tests/site-verification.test.mjs
