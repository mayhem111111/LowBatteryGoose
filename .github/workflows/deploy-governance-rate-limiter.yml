name: Deploy governance rate limiter

on:
  push:
    branches: [main]
    paths:
      - "workers/governance-rate-limiter/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not configured; deployment skipped."
          fi
      - name: Deploy internal rate limiter Worker
        if: steps.credential.outputs.available == 'true'
        run: npx --yes wrangler@4.36.0 deploy --config workers/governance-rate-limiter/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
